<div class="input-wrapper">
  @if (label()) {
    <label class="input-label">{{ label() }}</label>
  }
  
  <input
    [type]="type()"
    [placeholder]="placeholder()"
    [value]="value()"
    [disabled]="disabled()"
    [required]="required()"
    class="input-field"
    [ngClass]="{
      'has-error': error(),
      'is-focused': isFocused() && !error()
    }"
    (input)="emitValueChange($any($event.target).value)"
    (focus)="focus()"
    (blur)="blur()"
  />
  
  @if (error()) {
    <span class="input-error">{{ error() }}</span>
  }
</div>
