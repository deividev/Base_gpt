<div class="calendario-wrapper">
  <div class="calendar-demo-card">
    <p-datepicker
      [(ngModel)]="fecha"
      [showIcon]="true"
      iconDisplay="input"
      dateFormat="dd/mm/yy"
      placeholder="Selecciona una fecha"
      inputId="landing-calendar"
    />
  </div>

  @if (fecha) {
    <div class="fecha-seleccionada">Fecha seleccionada: {{ fecha | date: 'fullDate' }}</div>
  }
</div>
